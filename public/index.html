<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SFX Library Viewer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .header h1 {
      margin: 0 0 20px 0;
      color: #333;
      font-size: 2.5em;
      font-weight: 300;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 200px;
    }

    .input-group label {
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }

    .input, .select {
      padding: 12px 16px;
      border: 2px solid #e1e5e9;
      border-radius: 8px;
      font-size: 14px;
      background: white;
      transition: all 0.3s ease;
    }

    .input:focus, .select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .button.primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .button.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .button.secondary {
      background: #f8f9fa;
      color: #333;
      border: 2px solid #e1e5e9;
    }

    .button.secondary:hover {
      background: #e9ecef;
    }

    .button.danger {
      background: #dc3545;
      color: white;
    }

    .button.danger:hover {
      background: #c82333;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 15px;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #333;
    }

    .sorting-options {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .radio-group {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider {
      width: 120px;
      height: 6px;
      background: #ddd;
      outline: none;
      border-radius: 3px;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 20px;
      height: calc(100vh - 300px);
    }

    @media (max-width: 1024px) {
      .main-content {
        grid-template-columns: 1fr;
        grid-template-rows: 300px 1fr;
        height: auto;
      }
    }

    .file-list, .preview-panel {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    .file-list {
      overflow-y: auto;
    }

    .file-list h3 {
      margin: 0 0 20px 0;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .file-count {
      font-size: 14px;
      color: #666;
      font-weight: normal;
    }

    .files-container {
      max-height: calc(100% - 60px);
      overflow-y: auto;
    }

    .file-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .file-item:hover {
      background: rgba(102, 126, 234, 0.1);
      transform: translateX(5px);
    }

    .file-item.active {
      background: rgba(102, 126, 234, 0.2);
      border-color: #667eea;
    }

    .file-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 12px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-weight: 500;
      color: #333;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 12px;
      color: #666;
      display: flex;
      gap: 10px;
    }

    .preview-panel h3 {
      margin: 0 0 20px 0;
      color: #333;
    }

    .preview-content {
      text-align: center;
    }

    .preview-placeholder {
      color: #666;
      font-style: italic;
      margin: 40px 0;
    }

    .preview-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .preview-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin: 0 0 20px 0;
      word-break: break-word;
    }

    .preview-audio {
      width: 100%;
      margin: 20px 0;
      border-radius: 8px;
    }

    .preview-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 20px 0;
      font-size: 14px;
    }

    .info-item {
      text-align: left;
    }

    .info-label {
      color: #666;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .info-value {
      color: #333;
    }

    .preview-tags {
      margin: 20px 0;
    }

    .tag {
      display: inline-block;
      background: rgba(102, 126, 234, 0.1);
      color: #667eea;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin: 2px 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tag:hover {
      background: rgba(102, 126, 234, 0.2);
      transform: scale(1.05);
    }

    .preview-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .preview-actions .button {
      flex: 1;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .loading-spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      border: 1px solid #f5c6cb;
    }

    .success {
      background: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      border: 1px solid #c3e6cb;
    }

    .tags-cloud {
      margin: 15px 0;
      text-align: center;
      max-height: 100px;
      overflow-y: auto;
    }

    .popular-tag {
      display: inline-block;
      background: rgba(102, 126, 234, 0.1);
      color: #667eea;
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 11px;
      margin: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .popular-tag:hover {
      background: rgba(102, 126, 234, 0.2);
      transform: scale(1.1);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(102, 126, 234, 0.5);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(102, 126, 234, 0.7);
    }

    .status-indicator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 15px;
      border-radius: 25px;
      font-size: 12px;
      color: #333;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    .status-indicator.scanning {
      background: rgba(255, 193, 7, 0.9);
      color: #856404;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .no-results-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🎵 SFX Library Viewer</h1>
      
      <div class="controls">
        <div class="input-group">
          <label for="searchInput">Search Files</label>
          <input type="text" id="searchInput" class="input" placeholder="Search by name or tags..." />
        </div>
        
        <div class="input-group">
          <label for="extensionFilter">File Type</label>
          <select id="extensionFilter" class="select">
            <option value="">All Types</option>
          </select>
        </div>
        
        <div class="input-group">
          <label for="tagsInput">Filter by Tags</label>
          <input type="text" id="tagsInput" class="input" placeholder="tag1, tag2, tag3..." />
        </div>
        
        <button id="resetButton" class="button secondary">Reset Filters</button>
        <button id="scanButton" class="button primary">Rescan Library</button>
      </div>

      <div class="stats" id="statsContainer">
        <!-- Stats will be populated here -->
      </div>

      <div class="sorting-options">
        <div class="radio-group">
          <span>Sort by:</span>
          <label>
            <input type="radio" name="sortBy" value="filename" checked> Filename
          </label>
          <label>
            <input type="radio" name="sortBy" value="date"> Date
          </label>
          <label>
            <input type="radio" name="sortBy" value="size"> Size
          </label>
        </div>
        
        <div class="radio-group">
          <span>Order:</span>
          <label>
            <input type="radio" name="sortOrder" value="ASC" checked> Ascending
          </label>
          <label>
            <input type="radio" name="sortOrder" value="DESC"> Descending
          </label>
        </div>
        
        <div class="volume-control">
          <label for="volumeSlider">Volume:</label>
          <input type="range" id="volumeSlider" class="slider" min="0" max="100" value="50" />
          <span id="volumeValue">50%</span>
        </div>
      </div>

      <div class="tags-cloud" id="popularTags">
        <!-- Popular tags will be populated here -->
      </div>
    </div>

    <div class="main-content">
      <div class="file-list">
        <h3>
          Audio Files
          <span class="file-count" id="fileCount">Loading...</span>
        </h3>
        <div class="files-container" id="filesList">
          <div class="loading">
            <div class="loading-spinner"></div>
            Loading audio files...
          </div>
        </div>
      </div>

      <div class="preview-panel">
        <h3>Preview</h3>
        <div class="preview-content" id="previewContent">
          <div class="preview-placeholder">
            🎵 Select an audio file to preview
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="status-indicator" id="statusIndicator" style="display: none;">
    Ready
  </div>

  <script>
    class SFXLibraryClient {
      constructor() {
        this.files = [];
        this.currentFile = null;
        this.isLoading = false;
        this.scanStatus = null;
        
        this.init();
      }

      async init() {
        this.bindEvents();
        await this.loadInitialData();
        this.startStatusPolling();
      }

      bindEvents() {
        // Search and filters
        document.getElementById('searchInput').addEventListener('input', 
          this.debounce(() => this.loadFiles(), 500));
        
        document.getElementById('extensionFilter').addEventListener('change', 
          () => this.loadFiles());
        
        document.getElementById('tagsInput').addEventListener('input',
          this.debounce(() => this.loadFiles(), 500));

        // Sorting
        document.querySelectorAll('input[name="sortBy"]').forEach(radio => {
          radio.addEventListener('change', () => this.loadFiles());
        });
        
        document.querySelectorAll('input[name="sortOrder"]').forEach(radio => {
          radio.addEventListener('change', () => this.loadFiles());
        });

        // Controls
        document.getElementById('resetButton').addEventListener('click', 
          () => this.resetFilters());
        
        document.getElementById('scanButton').addEventListener('click', 
          () => this.triggerScan());

        // Volume control
        const volumeSlider = document.getElementById('volumeSlider');
        volumeSlider.addEventListener('input', (e) => {
          const value = e.target.value;
          document.getElementById('volumeValue').textContent = value + '%';
          this.setVolume(value / 100);
        });
      }

      async loadInitialData() {
        try {
          await Promise.all([
            this.loadFiles(),
            this.loadExtensions(),
            this.loadPopularTags(),
            this.loadStats()
          ]);
        } catch (error) {
          console.error('Error loading initial data:', error);
          this.showError('Failed to load initial data');
        }
      }

      async loadFiles() {
        if (this.isLoading) return;
        
        this.isLoading = true;
        this.showLoading();

        try {
          const params = this.getFilterParams();
          const response = await this.apiCall('/api/files?' + new URLSearchParams(params));
          
          if (response.success) {
            this.files = response.files;
            this.renderFiles();
            this.updateFileCount(response.files.length);
          } else {
            throw new Error(response.error || 'Failed to load files');
          }
        } catch (error) {
          console.error('Error loading files:', error);
          this.showError('Failed to load files: ' + error.message);
          this.files = [];
          this.renderFiles();
        } finally {
          this.isLoading = false;
        }
      }

      async loadExtensions() {
        try {
          const response = await this.apiCall('/api/extensions');
          if (response.success) {
            this.renderExtensions(response.extensions);
          }
        } catch (error) {
          console.error('Error loading extensions:', error);
        }
      }

      async loadPopularTags() {
        try {
          const response = await this.apiCall('/api/tags');
          if (response.success) {
            this.renderPopularTags(response.tags);
          }
        } catch (error) {
          console.error('Error loading tags:', error);
        }
      }

      async loadStats() {
        try {
          const response = await this.apiCall('/api/stats');
          if (response.success) {
            this.renderStats(response.stats);
          }
        } catch (error) {
          console.error('Error loading stats:', error);
        }
      }

      getFilterParams() {
        return {
          search: document.getElementById('searchInput').value,
          extension: document.getElementById('extensionFilter').value,
          tags: document.getElementById('tagsInput').value,
          sortBy: document.querySelector('input[name="sortBy"]:checked').value,
          sortOrder: document.querySelector('input[name="sortOrder"]:checked').value,
          limit: 1000
        };
      }

      renderFiles() {
        const container = document.getElementById('filesList');
        
        if (this.files.length === 0) {
          container.innerHTML = `
            <div class="no-results">
              <div class="no-results-icon">🔍</div>
              <div>No audio files found matching your criteria</div>
            </div>
          `;
          return;
        }

        container.innerHTML = this.files.map(file => `
          <div class="file-item" data-id="${file.id}" onclick="app.selectFile(${file.id})">
            <div class="file-icon">${file.extname.substring(1).toUpperCase()}</div>
            <div class="file-info">
              <div class="file-name" title="${file.filename}">${file.filename}</div>
              <div class="file-meta">
                <span>${file.sizeFormatted}</span>
                <span>${file.tags.slice(0, 3).join(', ')}</span>
              </div>
            </div>
          </div>
        `).join('');
      }

      renderExtensions(extensions) {
        const select = document.getElementById('extensionFilter');
        const currentValue = select.value;
        
        select.innerHTML = '<option value="">All Types</option>' + 
          extensions.map(ext => 
            `<option value="${ext.extension}">${ext.label} (${ext.count})</option>`
          ).join('');
        
        select.value = currentValue;
      }

      renderPopularTags(tags) {
        const container = document.getElementById('popularTags');
        
        if (tags.length === 0) {
          container.style.display = 'none';
          return;
        }

        container.style.display = 'block';
        container.innerHTML = tags.slice(0, 20).map(tag => 
          `<span class="popular-tag" onclick="app.addTagFilter('${tag.name}')">${tag.name} (${tag.count})</span>`
        ).join('');
      }

      renderStats(stats) {
        const container = document.getElementById('statsContainer');
        container.innerHTML = `
          <div class="stat-item">📁 ${stats.totalFiles} files</div>
          <div class="stat-item">🏷️ ${stats.totalTags} tags</div>
          <div class="stat-item">💾 ${stats.totalSizeFormatted}</div>
          ${stats.scannerStatus && stats.scannerStatus.isScanning ? 
            '<div class="stat-item">🔍 Scanning...</div>' : 
            '<div class="stat-item">✅ Ready</div>'}
        `;
      }

      async selectFile(fileId) {
        // Update active state
        document.querySelectorAll('.file-item').forEach(item => {
          item.classList.remove('active');
        });
        document.querySelector(`[data-id="${fileId}"]`)?.classList.add('active');

        try {
          const response = await this.apiCall(`/api/files/${fileId}`);
          if (response.success) {
            this.currentFile = response.file;
            this.renderPreview(response.file);
          }
        } catch (error) {
          console.error('Error loading file details:', error);
          this.showError('Failed to load file details');
        }
      }

      renderPreview(file) {
        const container = document.getElementById('previewContent');
        
        container.innerHTML = `
          <div class="preview-card">
            <div class="preview-title">${file.filename}</div>
            
            <audio id="audioPlayer" class="preview-audio" controls preload="metadata">
              <source src="/api/audio/${file.id}" type="audio/${file.extname.substring(1)}">
              Your browser does not support the audio element.
            </audio>
            
            <div class="preview-info">
              <div class="info-item">
                <div class="info-label">Size</div>
                <div class="info-value">${file.sizeFormatted}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Type</div>
                <div class="info-value">${file.extname.toUpperCase()}</div>
              </div>
            </div>
            
            <div class="preview-tags">
              ${file.tags.map(tag => 
                `<span class="tag" onclick="app.addTagFilter('${tag}')">${tag}</span>`
              ).join('')}
            </div>
            
            <div class="preview-actions">
              <button class="button danger" onclick="app.deleteFile(${file.id})">Delete</button>
              <button class="button secondary" onclick="app.showInFolder(${file.id})">Show in Folder</button>
            </div>
          </div>
        `;

        // Set volume and auto-play
        setTimeout(() => {
          const audio = document.getElementById('audioPlayer');
          if (audio) {
            const volume = document.getElementById('volumeSlider').value / 100;
            audio.volume = volume;
            // Don't auto-play by default for better UX
          }
        }, 100);
      }

      async deleteFile(fileId) {
        if (!confirm('Are you sure you want to delete this file?')) return;

        try {
          const response = await this.apiCall(`/api/files/${fileId}`, { method: 'DELETE' });
          if (response.success) {
            this.showSuccess('File deleted successfully');
            document.getElementById('previewContent').innerHTML = `
              <div class="preview-placeholder">🎵 Select an audio file to preview</div>
            `;
            await this.loadFiles();
          }
        } catch (error) {
          console.error('Error deleting file:', error);
          this.showError('Failed to delete file: ' + error.message);
        }
      }

      async showInFolder(fileId) {
        try {
          const response = await this.apiCall('/api/show-in-folder', {
            method: 'POST',
            body: JSON.stringify({ id: fileId })
          });
          
          if (response.success) {
            this.showSuccess('Opening file location...');
          }
        } catch (error) {
          console.error('Error showing in folder:', error);
          this.showError('Failed to open file location');
        }
      }

      async triggerScan() {
        try {
          const response = await this.apiCall('/api/scan', { method: 'POST' });
          if (response.success) {
            this.showSuccess('Library scan started...');
            this.updateScanStatus();
          }
        } catch (error) {
          console.error('Error triggering scan:', error);
          this.showError('Failed to start scan: ' + error.message);
        }
      }

      addTagFilter(tagName) {
        const tagsInput = document.getElementById('tagsInput');
        const currentTags = tagsInput.value.split(',').map(t => t.trim()).filter(t => t);
        
        if (!currentTags.includes(tagName)) {
          currentTags.push(tagName);
          tagsInput.value = currentTags.join(', ');
          this.loadFiles();
        }
      }

      resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('extensionFilter').value = '';
        document.getElementById('tagsInput').value = '';
        document.querySelector('input[name="sortBy"][value="filename"]').checked = true;
        document.querySelector('input[name="sortOrder"][value="ASC"]').checked = true;
        this.loadFiles();
      }

      setVolume(volume) {
        const audio = document.getElementById('audioPlayer');
        if (audio) {
          audio.volume = volume;
        }
      }

      async startStatusPolling() {
        try {
          const response = await this.apiCall('/api/scan/status');

          if (response.success) {
            this.updateStatusIndicator(response.status);
          }
        } catch (error) {
          // Ignore polling errors
        }
        setTimeout(startStatusPolling, 5000);
      }

      updateStatusIndicator(status) {
        const indicator = document.getElementById('statusIndicator');
        
        if (status.isScanning) {
          indicator.textContent = '🔍 Scanning library...';
          indicator.className = 'status-indicator scanning';
          indicator.style.display = 'block';
        } else {
          indicator.style.display = 'none';
        }
      }

      showLoading() {
        const container = document.getElementById('filesList');
        container.innerHTML = `
          <div class="loading">
            <div class="loading-spinner"></div>
            Loading audio files...
          </div>
        `;
      }

      updateFileCount(count) {
        document.getElementById('fileCount').textContent = `${count} files`;
      }

      showError(message) {
        this.showMessage(message, 'error');
      }

      showSuccess(message) {
        this.showMessage(message, 'success');
      }

      showMessage(message, type) {
        // Remove existing messages
        document.querySelectorAll('.message-toast').forEach(el => el.remove());

        const toast = document.createElement('div');
        toast.className = `message-toast ${type}`;
        toast.style.cssText = `
          position: fixed;
          top: 20px;
          right: 20px;
          z-index: 10000;
          padding: 15px 20px;
          border-radius: 8px;
          color: white;
          font-weight: 500;
          max-width: 400px;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
          backdrop-filter: blur(10px);
          animation: slideIn 0.3s ease;
        `;
        
        if (type === 'error') {
          toast.style.background = 'rgba(220, 53, 69, 0.95)';
        } else {
          toast.style.background = 'rgba(40, 167, 69, 0.95)';
        }
        
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
          toast.style.animation = 'slideOut 0.3s ease forwards';
          setTimeout(() => toast.remove(), 300);
        }, 4000);
      }

      async apiCall(url, options = {}) {
        const response = await fetch(url, {
          headers: {
            'Content-Type': 'application/json',
            ...options.headers
          },
          ...options
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        return await response.json();
      }

      debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
          const later = () => {
            clearTimeout(timeout);
            func(...args);
          };
          clearTimeout(timeout);
          timeout = setTimeout(later, wait);
        };
      }
    }

    // Add CSS animations
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      
      @keyframes slideOut {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }
    `;
    document.head.appendChild(style);

    // Initialize the app
    let app;
    document.addEventListener('DOMContentLoaded', () => {
      app = new SFXLibraryClient();
    });
  </script>
</body>

</html>
